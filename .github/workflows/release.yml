# Publishes @asitis/mcp, then the asitis alias package (packages/asitis), to npm with trusted
# publishing (OIDC) and provenance.
# Manual trigger only. Before the first run, configure a Trusted Publisher for this
# repository and workflow file on npmjs.com, and create the protected "npm"
# environment with required reviewers in the repository settings.
#
# Two jobs. "build" installs, tests and packs with read-only permissions and no OIDC token,
# so nothing that runs during npm ci or the tests can mint a publish token. "publish" runs in
# the npm environment, installs nothing, checks the tarball's SHA-256 against the one build
# recorded, and publishes that exact file.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match packages/mcp/package.json)"
        required: true

permissions:
  contents: read # checkout only

# One release at a time; a second run waits instead of cancelling a publish halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      alias_tarball: ${{ steps.pack-alias.outputs.tarball }}
      alias_sha256: ${{ steps.pack-alias.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Version matches the input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./packages/mcp/package.json').version")" = "$INPUT_VERSION"
          test "$(node -p "require('./packages/asitis/package.json').version")" = "$INPUT_VERSION"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Pack and record the SHA-256
        id: pack
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd packages/mcp
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          tarball="asitis-mcp-${INPUT_VERSION}.tgz"
          cd "$RUNNER_TEMP/release"
          test -f "$tarball"
          sha256sum "$tarball" | tee "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$tarball.sha256")" >> "$GITHUB_OUTPUT"
      - name: Pack the asitis alias and record the SHA-256
        id: pack-alias
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          cd packages/asitis
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          tarball="asitis-${INPUT_VERSION}.tgz"
          cd "$RUNNER_TEMP/release"
          test -f "$tarball"
          sha256sum "$tarball" | tee "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$tarball.sha256")" >> "$GITHUB_OUTPUT"
      - name: The packed server and CLI are the builds pinned in the plugin
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          dir="$RUNNER_TEMP/unpacked"
          mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/release/$TARBALL" -C "$dir"
          test "$(sha256sum "$dir/package/dist/asitis-mcp.mjs" | cut -d' ' -f1)" = "$(sed -n 's/^sha256 //p' plugins/asitis/server/VERSION)"
          test "$(sha256sum "$dir/package/dist/asitis.mjs" | cut -d' ' -f1)" = "$(sed -n 's/^asitis.mjs sha256 //p' plugins/asitis/server/VERSION)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read # read-only; this job checks out nothing
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: npm is new enough for trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/release
      - name: SHA-256 matches the build job
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
          ALIAS_TARBALL: ${{ needs.build.outputs.alias_tarball }}
          ALIAS_EXPECTED: ${{ needs.build.outputs.alias_sha256 }}
        working-directory: ${{ runner.temp }}/release
        run: |
          actual="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          echo "expected $EXPECTED"
          echo "actual   $actual"
          test -n "$EXPECTED" && test "$actual" = "$EXPECTED"
          alias_actual="$(sha256sum "$ALIAS_TARBALL" | cut -d' ' -f1)"
          echo "alias expected $ALIAS_EXPECTED"
          echo "alias actual   $alias_actual"
          test -n "$ALIAS_EXPECTED" && test "$alias_actual" = "$ALIAS_EXPECTED"
      # Skipped when this version is already on npm, so a re-run after the alias step fails only
      # publishes the alias (19 Nov: @asitis/mcp 0.4.6 went out, asitis had no Trusted Publisher yet).
      - name: Publish the tested tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          INPUT_VERSION: ${{ inputs.version }}
        working-directory: ${{ runner.temp }}/release
        run: |
          if npm view "@asitis/mcp@$INPUT_VERSION" version >/dev/null 2>&1; then
            echo "@asitis/mcp@$INPUT_VERSION is already on npm, skipping"
          else
            npm publish "./$TARBALL" --access public --provenance --ignore-scripts
          fi
      # After @asitis/mcp, since the alias depends on that exact version. Skipped when this version is
      # already on npm (the first asitis release was published by hand, before a Trusted Publisher
      # could be set up for a package that didn't exist yet).
      - name: Publish the tested asitis alias tarball
        env:
          TARBALL: ${{ needs.build.outputs.alias_tarball }}
          INPUT_VERSION: ${{ inputs.version }}
        working-directory: ${{ runner.temp }}/release
        run: |
          if npm view "asitis@$INPUT_VERSION" version >/dev/null 2>&1; then
            echo "asitis@$INPUT_VERSION is already on npm, skipping"
          else
            npm publish "./$TARBALL" --access public --provenance --ignore-scripts
          fi
