name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Plugin server and CLI copies match their SHA-256 pins
        shell: bash
        run: |
          sha() { node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "$1"; }
          check() {
            echo "$2: expected $1"
            echo "$2: actual   $(sha "$2")"
            test "$1" = "$(sha "$2")"
          }
          check "$(sed -n 's/^sha256 //p' plugins/asitis/server/VERSION)" plugins/asitis/server/asitis-mcp.mjs
          check "$(sed -n 's/^asitis.mjs sha256 //p' plugins/asitis/server/VERSION)" plugins/asitis/server/asitis.mjs
          check "$(sed -n 's/^asitis.mjs sha256 //p' action/VERSION)" action/asitis.mjs
          test "$(sha plugins/asitis/server/asitis.mjs)" = "$(sha action/asitis.mjs)"
